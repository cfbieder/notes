# Noted — Nginx configuration
# TLS via Tailscale cert, SPA routing, API reverse proxy

# Redirect HTTP → HTTPS (with local healthcheck bypass)
server {
    listen 80;
    # Catch-all — serves whatever hostname points at this container.
    # Set your own domain here if you prefer strict host matching.
    server_name _;

    # Container-local healthcheck — no TLS, no upstream dependency
    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 "ok\n";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    # TLS — certs provisioned by `tailscale cert`
    ssl_certificate     /etc/noted/certs/noted.crt;
    ssl_certificate_key /etc/noted/certs/noted.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    # SAMEORIGIN (not DENY) so the editor can render PDF attachments inline via
     # <iframe src="/api/v1/attachments/..."> (CR031). External clickjacking is
     # still blocked — only this same origin may frame the app.
    add_header X-Frame-Options SAMEORIGIN always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    # Upload size limit (match backend's 25MB)
    client_max_body_size 25m;

    # API reverse proxy
    location /api/ {
        proxy_pass http://noted-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # Longer timeouts for LLM-backed endpoints (translate, OCR, future
        # summarization/embeddings). The backend caps each LLM call below
        # this value so we never hit this nginx limit.
        proxy_read_timeout 180s;
        proxy_send_timeout 180s;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://noted-api:3001;
        proxy_http_version 1.1;
    }

    # Static assets — long cache
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PWA service worker — no cache
    location /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # PWA manifest — explicit MIME type required for Chrome install prompt
    location /manifest.webmanifest {
        root /usr/share/nginx/html;
        types { application/manifest+json webmanifest; }
        default_type application/manifest+json;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — serve index.html for client-side routes
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache HTML briefly
        location ~* \.html$ {
            add_header Cache-Control "no-cache";
        }
    }
}
