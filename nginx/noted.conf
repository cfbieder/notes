# Noted — Nginx configuration
# TLS via Tailscale cert, SPA routing, API reverse proxy

# Redirect HTTP → HTTPS
server {
    listen 80;
    server_name noted.tail413695.ts.net;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name noted.tail413695.ts.net;

    # TLS — certs provisioned by `tailscale cert`
    ssl_certificate     /etc/noted/certs/noted.crt;
    ssl_certificate_key /etc/noted/certs/noted.key;

    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    ssl_prefer_server_ciphers on;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 10m;

    # Security headers
    add_header X-Frame-Options DENY always;
    add_header X-Content-Type-Options nosniff always;
    add_header X-XSS-Protection "1; mode=block" always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;

    # Gzip
    gzip on;
    gzip_types text/plain text/css application/json application/javascript text/xml image/svg+xml;
    gzip_min_length 1000;

    # Upload size limit (match backend's 25MB)
    client_max_body_size 25m;

    # API reverse proxy
    location /api/ {
        proxy_pass http://noted-api:3001;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 60s;
        proxy_send_timeout 60s;
    }

    # Health check passthrough
    location /health {
        proxy_pass http://noted-api:3001;
        proxy_http_version 1.1;
    }

    # Static assets — long cache
    location /assets/ {
        root /usr/share/nginx/html;
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    # PWA service worker — no cache
    location /sw.js {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # PWA manifest
    location /manifest.webmanifest {
        root /usr/share/nginx/html;
        add_header Cache-Control "no-cache";
    }

    # SPA fallback — serve index.html for client-side routes
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html;

        # Cache HTML briefly
        location ~* \.html$ {
            add_header Cache-Control "no-cache";
        }
    }
}
