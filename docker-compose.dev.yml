services:
  postgres-dev:
    image: postgres:16-alpine
    container_name: noted-db-dev
    restart: unless-stopped
    environment:
      POSTGRES_USER: noteduser
      POSTGRES_PASSWORD: noted_dev_password
      POSTGRES_DB: noted_dev
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    ports:
      - "5432:5432"
    volumes:
      - noted_dev_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U noteduser -d noted_dev"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - noted-dev-network

volumes:
  noted_dev_data:
    driver: local

networks:
  noted-dev-network:
    driver: bridge
