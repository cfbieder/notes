services:
  postgres:
    image: postgres:16-alpine
    container_name: noted-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - noted_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - noted-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noted-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 30d
      UPLOAD_DIR: /app/uploads
      LOG_DIR: /app/logs
      LOG_LEVEL: info
      CORS_ORIGIN: https://noted.tail413695.ts.net
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: https://noted.tail413695.ts.net/api/v1/integrations/google-drive/callback
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://100.66.213.40:8080}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      LLM_OCR_TIMEOUT_MS: ${LLM_OCR_TIMEOUT_MS:-120000}
    volumes:
      - noted_uploads:/app/uploads
      - noted_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - noted-network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: ${APP_VERSION:-0.0.0}
        VITE_ENV_LABEL: PROD
    container_name: noted-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/noted.conf:/etc/nginx/conf.d/noted.conf:ro
      - /etc/noted/certs:/etc/noted/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:80/"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - noted-network

volumes:
  noted_prod_data:
    driver: local
  noted_uploads:
    driver: local
  noted_logs:
    driver: local

networks:
  noted-network:
    driver: bridge
