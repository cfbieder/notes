services:
  postgres:
    image: postgres:16-alpine
    container_name: noted-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${DB_USER}
      POSTGRES_PASSWORD: ${DB_PASSWORD}
      POSTGRES_DB: ${DB_NAME}
      POSTGRES_INITDB_ARGS: "--encoding=UTF8 --lc-collate=C --lc-ctype=C"
    volumes:
      - noted_prod_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER} -d ${DB_NAME}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - noted-network

  api:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: noted-api
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      NODE_ENV: production
      PORT: 3001
      HOST: 0.0.0.0
      DB_HOST: postgres
      DB_PORT: 5432
      DB_NAME: ${DB_NAME}
      DB_USER: ${DB_USER}
      DB_PASSWORD: ${DB_PASSWORD}
      JWT_SECRET: ${JWT_SECRET}
      JWT_REFRESH_SECRET: ${JWT_REFRESH_SECRET}
      JWT_EXPIRATION: 15m
      JWT_REFRESH_EXPIRATION: 30d
      UPLOAD_DIR: /app/uploads
      # 25 MB, matching nginx's client_max_body_size (owner decision 2026-10-03).
      MAX_FILE_SIZE: ${MAX_FILE_SIZE:-26214400}
      LOG_DIR: /app/logs
      LOG_LEVEL: info
      CORS_ORIGIN: ${CORS_ORIGIN:-http://localhost}
      GOOGLE_CLIENT_ID: ${GOOGLE_CLIENT_ID:-}
      GOOGLE_CLIENT_SECRET: ${GOOGLE_CLIENT_SECRET:-}
      GOOGLE_REDIRECT_URI: ${GOOGLE_REDIRECT_URI:-}
      LLM_GATEWAY_URL: ${LLM_GATEWAY_URL:-http://localhost:8080}
      # CR-020 (ocr-llm): client identity. Mapped explicitly because this
      # service has no `env_file:` — a value sitting in .env alone never
      # reaches the container. Empty default = no headers sent, so the app
      # behaves exactly as before until a key is configured.
      OCR_LLM_CLIENT_KEY: ${OCR_LLM_CLIENT_KEY:-}
      # CR-038: master key for stored AI provider keys. Same reason as above —
      # mapped explicitly or it never reaches the container. Empty default =
      # gateway-only; saving a Claude/OpenAI/local key is refused until set.
      AI_KEYS_ENC_KEY: ${AI_KEYS_ENC_KEY:-}
      # Allow a local / OpenAI-compatible AI provider on a private or Tailscale
      # host (SSRF guard opt-in). Off unless set to "true" in .env.prod.
      AI_PROVIDER_ALLOW_PRIVATE: ${AI_PROVIDER_ALLOW_PRIVATE:-false}
      LLM_ENABLED: ${LLM_ENABLED:-true}
      # Defaults equal the code's, so leaving these unset in .env.prod changes nothing.
      LLM_GENERATION_MODEL: ${LLM_GENERATION_MODEL:-qwen3:32b}
      LLM_CONTEXT_WINDOW: ${LLM_CONTEXT_WINDOW:-32000}
      LLM_GENERATE_TIMEOUT_MS: ${LLM_GENERATE_TIMEOUT_MS:-180000}
      LLM_OCR_TIMEOUT_MS: ${LLM_OCR_TIMEOUT_MS:-120000}
      LLM_TRANSLATE_TIMEOUT_MS: ${LLM_TRANSLATE_TIMEOUT_MS:-150000}
      LLM_TRANSLATE_MAX_CHARS: ${LLM_TRANSLATE_MAX_CHARS:-8000}
      # ocr-llm has registered noted_ai_assist_quick / noted_ai_assist_deep, so
      # /task (fallback chain, deadline, cost attribution) is the supported path
      # — LLM_PROTOCOLS.md §2. Set false only to fall back to /llm/generate with
      # the hardcoded bridging model names.
      LLM_TASK_ENABLED: ${LLM_TASK_ENABLED:-true}
    volumes:
      - noted_uploads:/app/uploads
      - noted_logs:/app/logs
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:3001/health"]
      interval: 30s
      timeout: 5s
      start_period: 10s
      retries: 3
    networks:
      - noted-network

  web:
    build:
      context: ./frontend
      dockerfile: Dockerfile
      args:
        VITE_APP_VERSION: ${APP_VERSION:-0.0.0}
        VITE_ENV_LABEL: PROD
    container_name: noted-web
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/noted.conf:/etc/nginx/conf.d/noted.conf:ro
      - /etc/noted/certs:/etc/noted/certs:ro
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:80/healthz"]
      interval: 30s
      timeout: 5s
      start_period: 5s
      retries: 3
    networks:
      - noted-network

volumes:
  noted_prod_data:
    driver: local
  noted_uploads:
    driver: local
  noted_logs:
    driver: local

networks:
  noted-network:
    driver: bridge
