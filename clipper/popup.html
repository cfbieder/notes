<!doctype html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Clip to Noted</title>
  <link rel="stylesheet" href="popup.css" />
</head>
<body>
  <div id="app">
    <header>
      <h1>Clip to Noted <span id="version" class="version"></span></h1>
      <a id="openOptions" href="#">Settings</a>
    </header>

    <div id="notLoggedIn" class="hidden">
      <p>Not logged in. Open settings to configure your server and sign in.</p>
      <button id="openOptionsBtn">Open settings</button>
    </div>

    <div id="main" class="hidden">
      <label class="field">
        <span>Mode</span>
        <select id="mode">
          <option value="article">Article (Readability)</option>
          <option value="selection">Selection</option>
          <option value="screenshot">Screenshot</option>
          <option value="link">Link only</option>
        </select>
      </label>

      <label class="field">
        <span>Title</span>
        <input id="title" type="text" />
      </label>

      <!-- CR039 A2 — shown only when the server supports research sources. -->
      <label id="asSourceRow" class="check hidden">
        <input type="checkbox" id="asSource" />
        <span>Save as research source</span>
      </label>

      <div id="sourceFields" class="hidden">
        <div class="row2">
          <label class="field">
            <span>Kind</span>
            <select id="srcKind">
              <option value="web">Web page</option>
              <option value="journal">Journal article</option>
              <option value="pdf_report">Report</option>
              <option value="book">Book</option>
              <option value="book_chapter">Book chapter</option>
              <option value="video">Video</option>
              <option value="podcast">Podcast</option>
              <option value="other">Other</option>
            </select>
          </label>
          <label class="field">
            <span>Published</span>
            <input id="srcPublished" type="text" placeholder="YYYY[-MM[-DD]]" />
          </label>
        </div>
        <label class="field">
          <span>Authors (one per line: Family, Given)</span>
          <textarea id="srcAuthors" rows="2"></textarea>
        </label>
        <label class="field">
          <span>Publication / site</span>
          <input id="srcContainer" type="text" />
        </label>
        <p id="pdfNote" class="note hidden">This tab is a PDF. It will be saved as a PDF source; the
          title, authors and date are read from the file, with AI.</p>
        <label id="snapshotRow" class="check">
          <input type="checkbox" id="srcSnapshot" checked />
          <span>Archive snapshot of the page</span>
        </label>
        <div class="field">
          <span>Chapters <em id="bookName"></em></span>
          <div id="chapters" class="chips"></div>
        </div>
      </div>

      <div id="noteFields">
      <label class="field">
        <span>Notebook</span>
        <select id="notebook">
          <option value="">— Inbox —</option>
        </select>
      </label>

      <label class="field">
        <span>Tags (comma-separated)</span>
        <input id="tags" type="text" placeholder="e.g. research, python" />
      </label>

      <label class="check">
        <input type="checkbox" id="sendToInbox" checked />
        <span>Send to inbox</span>
      </label>
      </div>

      <div id="preview" class="preview hidden"></div>

      <div class="actions">
        <button id="clipBtn" class="primary">Clip</button>
        <span id="status"></span>
        <button id="openExisting" class="link-btn hidden"></button>
      </div>
    </div>
  </div>

  <script src="popup.js"></script>
</body>
</html>
